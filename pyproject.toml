[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logshare-safe"
version = "0.1.0"
description = "Offline heuristic redaction of text logs and recursive JSON"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = []

[project.scripts]
logshare-safe = "logshare_safe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
